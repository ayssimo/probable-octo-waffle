<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Not Fear</title>

<style>
  :root {
    --bg: #bfe6f2;
    --panel: #f6dcf0;
    --input-bg: #ffffff;
    --text: #2a2a2a;
    --muted: #666666;

    --user-bubble: #a8dd9c;
    --ai-bubble: #ffffff;

    --btn: #7ecbea;
    --btn-text: #17303a;

    --results-bg: #fdf3ba;
    --border: rgba(42, 42, 42, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 12px;

    background: var(--bg);
    color: var(--text);

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: 680px;

    background: var(--panel);
    border-radius: 28px;

    padding: 22px;

    display: flex;
    flex-direction: column;
    gap: 14px;

    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.08);
  }

  .header {
    text-align: center;
  }

  .header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .header p {
    margin: 6px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .chat {
    width: 100%;

    min-height: 360px;
    max-height: 52vh;

    overflow-y: auto;

    display: flex;
    flex-direction: column;
    gap: 10px;

    padding: 8px 4px;

    scroll-behavior: smooth;
  }

  .bubble {
    max-width: 82%;

    padding: 11px 15px;

    line-height: 1.45;
    font-size: 0.95rem;

    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .bubble.user {
    align-self: flex-end;

    background: var(--user-bubble);

    border-radius: 18px 18px 5px 18px;
  }

  .bubble.ai {
    align-self: flex-start;

    background: var(--ai-bubble);

    border-radius: 18px 18px 18px 5px;

    box-shadow:
      0 2px 5px rgba(0, 0, 0, 0.06);
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  #input {
    flex: 1;

    min-width: 0;

    border: none;
    outline: none;

    background: var(--input-bg);
    color: var(--text);

    border-radius: 18px;

    padding: 13px 16px;

    font-size: 1rem;
    font-family: inherit;
  }

  #input::placeholder {
    color: #888;
  }

  .buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  button {
    border: none;
    outline: none;

    background: var(--btn);
    color: var(--btn-text);

    padding: 11px 17px;

    border-radius: 16px;

    font-size: 0.9rem;
    font-weight: 650;

    cursor: pointer;

    transition:
      transform 0.15s ease,
      opacity 0.15s ease;
  }

  button:hover {
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
  }

  .results {
    display: none;

    background: var(--results-bg);

    border-radius: 20px;

    padding: 17px;

    flex-direction: column;
    gap: 14px;
  }

  .results.show {
    display: flex;
  }

  .results h2 {
    margin: 0;

    font-size: 1.2rem;
  }

  .encouragement {
    margin: 0;

    font-size: 1rem;
    font-weight: 650;

    line-height: 1.45;
  }

  .obs {
    padding-top: 4px;
  }

  .obs h3 {
    margin: 0 0 7px;

    font-size: 1rem;
  }

  .obs p {
    margin: 3px 0;

    font-size: 0.9rem;
    line-height: 1.45;
  }

  .label {
    margin-top: 8px;

    font-size: 0.7rem;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 0.05em;

    color: var(--muted);
  }

  .caveat {
    margin: 0;

    text-align: center;

    font-size: 0.75rem;
    line-height: 1.4;

    color: var(--muted);
  }

  .typing {
    opacity: 0.65;
    font-style: italic;
  }

  @media (max-width: 520px) {
    body {
      padding: 10px;
      align-items: stretch;
    }

    .app {
      min-height: calc(100vh - 20px);
      border-radius: 22px;
      padding: 16px;
    }

    .chat {
      min-height: 300px;
      max-height: 55vh;
    }

    .bubble {
      max-width: 88%;
    }

    .buttons {
      flex-direction: column;
    }

    button {
      width: 100%;
    }
  }
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Do Not Fear</h1>
    <p>Practice speaking English without being afraid of mistakes.</p>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-row">
    <input
      type="text"
      id="input"
      placeholder="Write in English..."
      autocomplete="off"
    >
  </div>

  <div class="buttons">
    <button id="sendBtn">Send</button>
    <button id="resultsBtn">Show Results</button>
  </div>

  <div class="results" id="results"></div>

</div>

<script>

  /* =========================
     STATE
  ========================= */

  let history = [];

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const resultsBtn = document.getElementById("resultsBtn");
  const results = document.getElementById("results");


  /* =========================
     INITIAL MESSAGE
  ========================= */

  addBubble(
    "Hi! I'm here to help you practice English without worrying about mistakes. What would you like to talk about?",
    "ai"
  );


  /* =========================
     UI
  ========================= */

  function addBubble(text, role) {

    const div = document.createElement("div");

    div.className = "bubble " + role;

    // textContent is intentional.
    // It prevents AI/user text from being interpreted as HTML.
    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
  }


  function showTyping() {

    const div = document.createElement("div");

    div.className = "bubble ai typing";
    div.id = "typing";

    div.textContent = "Thinking...";

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
  }


  function removeTyping() {

    const typing = document.getElementById("typing");

    if (typing) {
      typing.remove();
    }
  }


  /* =========================
     AI REQUEST
  ========================= */

  async function callAI(messages, mode = "chat") {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        messages: messages,
        mode: mode
      })

    });


    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Invalid server response.");
    }


    if (!response.ok) {

      throw new Error(
        data.error || "AI request failed."
      );

    }


    return data;
  }


  /* =========================
     SEND MESSAGE
  ========================= */

  async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    if (sendBtn.disabled) return;


    // Display user's message
    addBubble(text, "user");


    // Save message
    history.push({
      role: "user",
      content: text
    });


    input.value = "";

    sendBtn.disabled = true;
    resultsBtn.disabled = true;


    showTyping();


    try {

      /*
        The system instructions are already stored
        securely on the server.

        We only send the conversation here.
      */

      const data = await callAI(
        history,
        "chat"
      );


      removeTyping();


      const answer =
        data.text ||
        "I'm having trouble thinking of a response right now.";


      addBubble(answer, "ai");


      history.push({
        role: "assistant",
        content: answer
      });


    } catch (error) {

      console.error(error);

      removeTyping();

      addBubble(
        "I'm having trouble connecting right now. Please try again.",
        "ai"
      );

    }


    sendBtn.disabled = false;
    resultsBtn.disabled = false;

    input.focus();
  }


  /* =========================
     ENCOURAGEMENT
  ========================= */

  const encouragements = [

    "The fact that you started is already something to be proud of.",

    "You already took the first step, and that matters.",

    "You started even though you were afraid, and that is already progress."

  ];


  function getEncouragement() {

    const savedIndex =
      Number(
        localStorage.getItem(
          "dnfEncouragementIndex"
        ) || "0"
      );


    const index =
      savedIndex % encouragements.length;


    const phrase =
      encouragements[index];


    const nextIndex =
      (index + 1) % encouragements.length;


    localStorage.setItem(
      "dnfEncouragementIndex",
      String(nextIndex)
    );


    return phrase;
  }


  /* =========================
     SHOW RESULTS
  ========================= */

  async function showResults() {

    const userMessages =
      history.filter(
        message => message.role === "user"
      );


    if (userMessages.length < 2) {

      results.innerHTML = "";

      const message =
        document.createElement("p");

      message.className = "caveat";

      message.textContent =
        "Have a bit more of a conversation first, then check back here.";

      results.appendChild(message);

      results.classList.add("show");

      return;
    }


    results.innerHTML = "";


    const loading =
      document.createElement("p");

    loading.className = "caveat";

    loading.textContent =
      "Looking over the conversation...";

    results.appendChild(loading);

    results.classList.add("show");


    resultsBtn.disabled = true;


    try {

      const data =
        await callAI(
          history,
          "analysis"
        );


      renderResults(
        data.observations || []
      );


    } catch (error) {

      console.error(error);

      results.innerHTML = "";

      const message =
        document.createElement("p");

      message.className = "caveat";

      message.textContent =
        "Could not generate results right now. Please try again.";

      results.appendChild(message);

    }


    resultsBtn.disabled = false;
  }


  /* =========================
     RENDER RESULTS
  ========================= */

  function renderResults(observations) {

    results.innerHTML = "";


    /*
      Header
    */

    const heading =
      document.createElement("h2");

    heading.textContent =
      "Your Results";

    results.appendChild(heading);


    /*
      Fixed rotating encouragement
    */

    const encouragement =
      document.createElement("p");

    encouragement.className =
      "encouragement";

    encouragement.textContent =
      getEncouragement();

    results.appendChild(encouragement);


    /*
      No observations
    */

    if (!observations.length) {

      const empty =
        document.createElement("p");

      empty.className = "caveat";

      empty.textContent =
        "Nothing clear to point to yet. Keep chatting and check back.";

      results.appendChild(empty);

      addCaveat();

      return;
    }


    /*
      Observations
    */

    observations.forEach(
      observation => {

        const div =
          document.createElement("div");

        div.className = "obs";


        const title =
          document.createElement("h3");

        title.textContent =
          observation.quality ||
          "Something I noticed";


        const noticedLabel =
          document.createElement("div");

        noticedLabel.className =
          "label";

        noticedLabel.textContent =
          "What I noticed";


        const noticed =
          document.createElement("p");

        noticed.textContent =
          observation.noticed || "";


        const evidenceLabel =
          document.createElement("div");

        evidenceLabel.className =
          "label";

        evidenceLabel.textContent =
          "Evidence";


        const evidence =
          document.createElement("p");

        evidence.textContent =
          observation.evidence || "";


        const whyLabel =
          document.createElement("div");

        whyLabel.className =
          "label";

        whyLabel.textContent =
          "Why it matters";


        const why =
          document.createElement("p");

        why.textContent =
          observation.why_it_matters || "";


        div.appendChild(title);

        div.appendChild(noticedLabel);
        div.appendChild(noticed);

        div.appendChild(evidenceLabel);
        div.appendChild(evidence);

        div.appendChild(whyLabel);
        div.appendChild(why);


        results.appendChild(div);

      }
    );


    addCaveat();
  }


  function addCaveat() {

    const caveat =
      document.createElement("p");

    caveat.className =
      "caveat";

    caveat.textContent =
      "These observations reflect patterns in this conversation only. They are not a diagnosis, psychological score, or personality assessment.";

    results.appendChild(caveat);
  }


  /* =========================
     EVENTS
  ========================= */

  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  resultsBtn.addEventListener(
    "click",
    showResults
  );


  input.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


</script>

</body>
</html>
